name: Career Job Monitor

"on":
  schedule:
    # GitHub cron is UTC. Minutes 7 and 37 avoid top-of-hour congestion.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: career-job-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test

      - name: Scan career pages and rebuild workbook
        env:
          WORKBOOK_BUILDER: src/build_workbook_ci.mjs
        run: node src/monitor.mjs --once

      - name: Verify generated workbook
        run: npm run build-workbook:ci -- --verify

      - name: Publish GitHub job and source-health alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/github_notify.mjs

      - name: Upload current workbook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Job-Monitor-${{ github.run_number }}
          path: outputs/job-monitor/Job_Monitor.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Persist monitor state and workbook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/jobs.json data/runs.json data/current_candidates.json data/decision_history.json data/source_health.json data/last_batch.json LATEST_JOBS.md outputs/job-monitor/Job_Monitor.xlsx
          if git diff --cached --quiet; then
            echo "No persistent changes to commit."
            exit 0
          fi
          git commit -m "chore: update job monitor state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
