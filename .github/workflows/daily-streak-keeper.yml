name: Daily Activity & Streak Keeper

on:
  schedule:
    # Runs 4 times daily (UTC 01:15, 07:15, 13:15, 19:15) to guarantee daily streak across all timezones
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-streak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update Daily Telemetry & Activity Log
        run: python scripts/update_daily_telemetry.py

      - name: Commit & Push Daily Activity
        run: |
          git config user.name "Taran Mamidala"
          git config user.email "mamidalataran6333@gmail.com"
          git add data/activity_log.json data/daily_telemetry.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(telemetry): record automated daily market activity [skip ci]"
          git pull --rebase origin main || true
          git push origin main
